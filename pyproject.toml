[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osint-ai-pwg"
version = "0.0.1"
description = "Pilot pipeline: LLM password guessing with OSINT-derived PII (thesis, Maximus Bayu Proudiasto)"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

# Layer 3 (inference) deps are heavy + GPU-bound; installed on Colab only.
[project.optional-dependencies]
guess = [
    "torch",
    "transformers>=4.44",
    "peft>=0.11",
    "accelerate",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
